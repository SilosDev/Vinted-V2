<title>Mój Portfel Vinted</title>

<style>
:root {
  --bg: #181c1d;
  --surface: #111214;
  --elevated: #2c3135;
  --fg: #edf1f2;
  --muted: #8b9394;
  --faint: #6a7272;
  --accent: #459ba8;
  --accent-fg: #111214;
  --badge: #cf4457;
  --line: #262b2c;

  --font:
    "Inter",
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "SF Pro Display",
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}

body {
  min-height: 100dvh;
}

.phone {
  width: 100%;
  max-width: 390px;
  height: 100dvh;
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.header {
  height: calc(48px + env(safe-area-inset-top));
  padding-top: env(safe-area-inset-top);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  flex-shrink: 0;
}

.header h1 {
  font-size: 17px;
  font-weight: 400;
  letter-spacing: -0.01em;
  line-height: 1.2;
  cursor: pointer;
}

.icon-btn {
  position: absolute;
  top: env(safe-area-inset-top);
  height: 48px;
  width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  color: var(--fg);
  cursor: pointer;
}

.icon-btn.left {
  left: 4px;
}

.icon-btn.right {
  right: 4px;
}

.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.pending {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px 16px;
}

.pending .label {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.01em;
  cursor: pointer;
}

.pending .amount-wrap {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  cursor: pointer;
}

.balance {
  text-align: center;
  padding: 28px 16px 0;
}

.balance .amount {
  font-size: 40px;
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}

.balance .label {
  margin-top: 8px;
  font-size: 14px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--muted);
  cursor: pointer;
}

.actions {
  display: flex;
  justify-content: center;
  gap: 64px;
  padding: 28px 16px 32px;
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  color: var(--fg);
  font-family: inherit;
  cursor: pointer;
}

.action .circle {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.action .circle svg {
  color: #fff;
  stroke: #fff;
}

.action .circle svg circle[fill] {
  fill: #fff;
}

.action span {
  font-size: 12px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--muted);
  cursor: pointer;
}

.divider {
  height: 1px;
  background: var(--line);
  flex-shrink: 0;
}

.month {
  padding: 16px 16px 4px;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--muted);
  cursor: pointer;
}

.txn {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  padding: 12px 16px;
  background: none;
  border: none;
  color: inherit;
  font-family: inherit;
  text-align: left;
  cursor: pointer;
}

.txn-left {
  flex: 1;
  min-width: 0;
}

.txn-status {
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--accent);
  cursor: pointer;
}

.txn-title {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
}

.txn-date {
  margin-top: 2px;
  font-size: 12.5px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--muted);
  cursor: pointer;
}

.txn-right {
  display: flex;
  align-items: center;
  gap: 2px;
  padding-top: 18px;
  font-size: 15px;
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.015em;
  flex-shrink: 0;
  cursor: pointer;
}

.nav {
  flex-shrink: 0;
  border-top: 1px solid var(--line);
  background: var(--bg);
  padding: 6px 0 max(10px, env(safe-area-inset-bottom));
}

.nav ul {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

.nav button {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px 0;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 10px;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--muted);
  cursor: pointer;
  position: relative;
}

.nav button.active {
  color: var(--fg);
}

.nav .badge {
  position: absolute;
  top: 2px;
  right: calc(50% - 14px);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--badge);
}

.home-bar {
  width: 118px;
  height: 5px;
  border-radius: 999px;
  background: var(--elevated);
  margin: 6px auto 0;
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, .6);
  z-index: 40;
  display: none;
}

.overlay.open {
  display: block;
}

.edit-modal {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 50%;
  transform: translateY(-50%) scale(.96);
  background: var(--surface);
  border-radius: 14px;
  z-index: 50;
  padding: 20px;
  display: none;
  opacity: 0;
  transition: opacity .18s, transform .18s;
}

.edit-modal.open {
  display: block;
  opacity: 1;
  transform: translateY(-50%) scale(1);
}

.edit-modal h3 {
  font-size: 16px;
  font-weight: 500;
  letter-spacing: -0.015em;
  margin-bottom: 12px;
}

.edit-modal input,
.edit-modal textarea {
  width: 100%;
  background: var(--elevated);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 400;
  color: var(--fg);
  outline: none;
  letter-spacing: -0.01em;
}

.edit-modal textarea {
  min-height: 72px;
  resize: vertical;
}

.edit-modal input:focus,
.edit-modal textarea:focus {
  border-color: var(--accent);
}

.edit-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.edit-actions button {
  flex: 1;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  cursor: pointer;
}

.edit-actions .cancel {
  background: var(--elevated);
  color: var(--fg);
}

.edit-actions .save {
  background: var(--accent);
  color: var(--accent-fg);
}

.editable {
  cursor: pointer;
}

.editable:active {
  opacity: .7;
}

svg {
  display: block;
}

@media (display-mode: standalone) {
  html,
  body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    background: var(--bg);
  }

  .phone {
    width: 100%;
    max-width: none;
    height: 100dvh;
    min-height: 100dvh;
    max-height: none;
    margin: 0;
    box-shadow: none;
  }
}

@media (max-width: 389px) {
  .actions {
    gap: 48px;
  }
}
</style>
</head>

<script>
let editingEl = null;

const overlay = document.getElementById("overlay");
const modal = document.getElementById("editModal");
const input = document.getElementById("editInput");

function openEdit(el) {
  editingEl = el;

  input.value = (el.textContent || "")
    .replace(/\u00a0/g, " ")
    .trim();

  overlay.classList.add("open");
  modal.classList.add("open");

  setTimeout(() => {
    input.focus();
    input.select();
  }, 50);
}

function closeEdit() {
  overlay.classList.remove("open");
  modal.classList.remove("open");
  editingEl = null;
}

function saveEdit() {
  if (!editingEl) {
    return;
  }

  let val = input.value;

  if (/\d.*,?\d*\s*zł/i.test(val)) {
    val = val.replace(/\s+zł/i, "\u00a0zł");
  }

  editingEl.textContent = val;

  closeEdit();
}

document.querySelectorAll("[data-edit]").forEach((el) => {
  el.addEventListener("click", (e) => {
    e.preventDefault();
    e.stopPropagation();
    openEdit(el);
  });
});

overlay.addEventListener("click", closeEdit);

document
  .getElementById("editCancel")
  .addEventListener("click", closeEdit);

document
  .getElementById("editSave")
  .addEventListener("click", saveEdit);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    saveEdit();
  }

  if (e.key === "Escape") {
    closeEdit();
  }
});
</script>

</body>
</html>
